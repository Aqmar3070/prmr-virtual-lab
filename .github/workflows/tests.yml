name: PRMR numerical tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate interactive application syntax
        run: |
          node --check src/r04_app.mjs
          node --check src/r04_engine.mjs
          node --check src/r04_visuals.mjs
          node --check src/r04_atlas.mjs
          node --check src/r04_embedded.mjs
          node --check src/r04_molecule_deck.mjs
          node --check src/r05_animal3d.mjs
      - name: Run numerical tests
        run: node --test tests/*.test.mjs
