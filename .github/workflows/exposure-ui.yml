name: Atlas et prises dans le navigateur
on:
  pull_request:
    paths:
      - 'exposures.html'
      - 'exposure-console.css'
      - 'src/exposure-*.mjs'
      - 'assets/human3d/**'
      - 'tests/exposure-browser.cjs'
      - '.github/workflows/exposure-ui.yml'
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:4173/exposures.html >/dev/null && break; sleep 1; done
          node tests/exposure-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vues-atlas
          path: /tmp/atlas-*.png
