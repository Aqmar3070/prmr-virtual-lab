name: Sonde des notices BDPM
on:
  push:
    branches: ['notices-sonde']
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire la rubrique 4.8 d'une notice
        run: |
          for id in 60234100 65358002; do
            for url in "https://base-donnees-publique.medicaments.gouv.fr/affichageDoc.php?specid=$id&typedoc=R" "https://base-donnees-publique.medicaments.gouv.fr/medicament/$id/extrait"; do
              echo "===== $url"
              curl -sL -A "PRMR-Virtual-Lab/1.0 (recherche)" -o page.html -w "HTTP %{http_code} taille %{size_download}\n" "$url"
              python3 - <<'PY'
          import re
          h=open('page.html',encoding='utf-8',errors='replace').read()
          i=h.find('4.8')
          print('position 4.8 :',i)
          j=h.find('Effets ind')
          print('position Effets ind :',j)
          k=max(i,0)
          print(h[k-300:k+3500])
          PY
            done
          done
